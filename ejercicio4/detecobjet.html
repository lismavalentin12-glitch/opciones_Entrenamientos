<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detección de Objetos</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>

<h1>4. Detección de Objetos</h1>
<h2 id="nombre">Cargando modelo...</h2>
<h3 id="confianza"></h3>

<script>

let classifier;
let video;
let ultimoObjeto = "";

function preload() {
    classifier = ml5.imageClassifier(
        "ejercicio4/model/model.json"
    );
}

function setup() {
    createCanvas(320, 240);
    video = createCapture(VIDEO);
    video.size(320, 240); 
    video.hide();
    classifyVideo();
}

function draw() {
    image(video, 0, 0, width, height);
}

function classifyVideo() {
    classifier.classify(video, gotResult);
}

function gotResult(results) {
    console.log(results);

    let nombre = results[0].label;
    let confianza = results[0].confidence;

    if(confianza >= 0.5){
        document.getElementById("nombre").innerHTML =
            "Objeto: " + nombre;
        document.getElementById("confianza").innerHTML =
            "Confianza: " + (confianza * 100).toFixed(2) + "%";
        if(nombre !== ultimoObjeto){
            let voz = new SpeechSynthesisUtterance(nombre);
            voz.lang = "es-ES";
            voz.rate = 1;
            voz.pitch = 1;
            speechSynthesis.cancel();
            speechSynthesis.speak(voz);
            ultimoObjeto = nombre;
        }
    }else{
        document.getElementById("nombre").innerHTML =
            "No identificado";
        document.getElementById("confianza").innerHTML = "";
        ultimoObjeto = "";
    }
    classifyVideo();
}
</script>
</body>
</html>
